# Tek komutla hem LibreTranslate (çeviri) hem de eklentiyi ayağa kaldırır:
#   docker compose up -d
#
# Sadece çeviri sunucusunu çalıştırmak isterseniz (eklentiyi npm ile çalıştırırken):
#   docker compose up -d libretranslate

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      # macOS'ta 5000 portu "AirPlay Receiver" tarafından kullanılır; bu yüzden
      # host tarafını varsayılan olarak 5050 yaptık. Bu port yalnızca yerel
      # erişim/hata ayıklama içindir: eklenti, çeviri sunucusuna konteyner ağı
      # üzerinden (libretranslate:5000) eriştiği için bu portu değiştirmek
      # çalışmayı etkilemez.
      - "127.0.0.1:${LT_HOST_PORT:-5050}:5000"
    environment:
      # Sadece İngilizce ve Türkçe modellerini yükle: daha hızlı başlangıç, düşük RAM
      LT_LOAD_ONLY: "en,tr"
      LT_UPDATE_MODELS: "true"
    volumes:
      # ÖNEMLİ: volume'u .local'e bağlıyoruz (daha derin bir yola değil) ki
      # konteynerdeki libretranslate kullanıcısının izinleri korunsun. Daha derin
      # bir yola bağlamak klasörü root'a ait kılar ve "Permission denied" hatası verir.
      - lt-models:/home/libretranslate/.local
    healthcheck:
      # Konteynerin kendi venv python'ı ile HTTP kontrolü (sürümden bağımsız, sağlam)
      test: ["CMD-SHELL", "/app/venv/bin/python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages').getcode()==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # İlk açılışta model indirmesi uzun sürebilir; bol süre tanı
      start_period: 300s

  addon:
    build: .
    container_name: turkish-subs-addon
    restart: unless-stopped
    depends_on:
      # service_started: eklenti, LibreTranslate'in "healthy" olmasını beklemeden
      # hemen açılır (model indirilirken bile landing/manifest erişilebilir olur).
      # İlk çeviri, model hazır olduğunda çalışır.
      libretranslate:
        condition: service_started
    ports:
      # macOS'ta 7000 portu da AirPlay tarafından kullanılabilir. Doluysa .env'de
      # ADDON_HOST_PORT=7700 yapın ve BASE_URL'i de http://127.0.0.1:7700 olarak güncelleyin.
      - "${ADDON_HOST_PORT:-7000}:7000"
    environment:
      PORT: "7000"
      # BASE_URL boş bırakılırsa altyazı adresleri isteğin Host'undan türetilir
      # (TV/telefon dahil her cihaz için doğru adres). Sabitlemek isterseniz .env'de verin.
      BASE_URL: "${BASE_URL:-}"
      TRANSLATE_PROVIDER: "libretranslate"
      # Konteyner ağı içinden çeviri sunucusuna servis adıyla erişilir
      LIBRETRANSLATE_URL: "http://libretranslate:5000"
      OPENSUBTITLES_API_KEY: "${OPENSUBTITLES_API_KEY}"
      OPENSUBTITLES_USERNAME: "${OPENSUBTITLES_USERNAME:-}"
      OPENSUBTITLES_PASSWORD: "${OPENSUBTITLES_PASSWORD:-}"
      OPENSUBTITLES_USER_AGENT: "${OPENSUBTITLES_USER_AGENT:-TurkishSubsTranslator v1.0}"
      SUBTITLE_LANG: "${SUBTITLE_LANG:-tur}"
    volumes:
      - ./.cache:/app/.cache

volumes:
  lt-models:
